# Class / order feats — Pathfinder Secrets of Magic (mechanical fields only).
# Deep-merged under `feats` with feats.yml and feats_pc2.yml.
# Kept separate so source books stay navigable and file sizes stay sane.
#
feats:
  fire_lung:
    name: Fire Lung
    level: 1
    traits:
    - druid
    category: class
    slots:
    - class
    source: Pathfinder Secrets of Magic
    summary: Ignore concealment from smoke/ash; success vs persistent fire becomes
      critical success (critical failures become failures).
    prerequisites:
      special: flame order
  shore_step:
    name: Shore Step
    level: 1
    traits:
    - druid
    category: class
    slots:
    - class
    source: Pathfinder Secrets of Magic
    summary: Ignore difficult terrain from shallow water. Success on Balance (slippery/wet)
      or Swim becomes critical success.
    prerequisites:
      special: wave order
