# Mundane vendor catalogs.
# Lookup: Pf2e.read_data("vendors", "armorer")
#
# Each vendor lists stock as catalog section + slug.
# price comes from the catalog entry (sp); missing price = not for sale.
# stock: null / omit = unlimited; integer = limited quantity (future).
#
# buy_currency: purse only (must withdraw from Society account first).
# vendor_level_lock in pf2e.yml: item level must be <= character level + offset.
#
# Generated to match Player Core weapons.yml / armor.yml / items.yml.
#

