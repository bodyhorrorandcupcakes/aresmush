# Class option grants (Remaster-oriented). Open lists gated in chargen_policy.rb.
# Lookup: Pf2e.read_data("subclasses", "bloodline") then [slug]
# apply via Pf2e.apply_subclass_grants!(sheet)

subclasses:
  bloodline:
    imperial:
      name: Imperial
      tradition: arcane
      skills: [arcana, society]
      cantrips: [detect_magic]
      focus_spells: [ancestral_memories]
      repertoire_gifts:
        "0": detect_magic
        "1": force_barrage
      notes: "Bloodline spells and gifts scale with level; initial focus is ancestral_memories."

    elemental:
      name: Elemental
      tradition: primal
      skills: [nature, intimidation]
      cantrips: [ignition]
      focus_spells: [elemental_toss]
      repertoire_gifts:
        "0": ignition
        "1": breathe_fire
      notes: "Default elemental influence = fire for v1. Air/earth/metal/water/wood influence can be added later."

    fey:
      name: Fey
      tradition: primal
      skills: [deception, nature]
      cantrips: [figment]
      focus_spells: [faerie_dust]
      repertoire_gifts:
        "0": figment
        "1": charm
      notes: "Bloodline focus: faerie_dust (initial)."

    angelic:
      name: Angelic
      tradition: divine
      skills: [diplomacy, religion]
      cantrips: [light]
      focus_spells: [angelic_halo]
      repertoire_gifts:
        "0": light
        "1": heal
      notes: "Bloodline focus: angelic_halo (initial)."

  doctrine:
    cloistered:
      name: Cloistered Cleric
      steps:
        "1":
          features: [first_doctrine_cloistered]
          feats: [domain_initiate]
        "3":
          features: [second_doctrine_cloistered]
          proficiency:
            fortitude: E
        "7":
          features: [third_doctrine_cloistered]
          spellcasting:
            proficiency: E
        "11":
          features: [fourth_doctrine_cloistered]
          proficiency:
            attacks:
              simple: E
              unarmed: E
        "15":
          features: [fifth_doctrine_cloistered]
          spellcasting:
            proficiency: M
        "19":
          features: [final_doctrine_cloistered]
          spellcasting:
            proficiency: L
      notes: "Domain Initiate at 1st. Spell proficiency advances on the cloistered track."

    warpriest:
      name: Warpriest
      steps:
        "1":
          features: [first_doctrine_warpriest]
          feats: [shield_block]
          proficiency:
            fortitude: E
            defenses:
              light: T
              medium: T
        "3":
          features: [second_doctrine_warpriest]
          proficiency:
            attacks:
              martial: T
        "7":
          features: [third_doctrine_warpriest]
          proficiency:
            attacks:
              simple: E
              unarmed: E
              martial: E
        "11":
          features: [fourth_doctrine_warpriest]
          spellcasting:
            proficiency: E
        "15":
          features: [fifth_doctrine_warpriest]
          proficiency:
            defenses:
              light: E
              medium: E
        "19":
          features: [final_doctrine_warpriest]
          spellcasting:
            proficiency: M
      notes: "Armor + Fort expert + Shield Block at 1st. Martial weapons at 3rd. Spell proficiency lags cloistered."

  racket:
    ruffian:
      name: Ruffian
      skills: [intimidation]
      key_ability_options: [str, dex]
      proficiency:
        defenses:
          medium: T
      notes: "Medium armor. Key ability Str or Dex (cg/racket ruffian str). Wider SA weapons are combat-side later."

    scoundrel:
      name: Scoundrel
      skills: [deception, diplomacy]
      key_ability_options: [cha, dex]
      notes: "Key ability Cha or Dex (cg/racket scoundrel cha). Feint upgrades are combat-side later."

    thief:
      name: Thief
      skills: [thievery]
      key_ability_options: [dex]
      combat_tag: dex_damage_finesse
      notes: "Key ability Dex. Dexterity to damage with finesse melee is combat-side later."

    mastermind:
      name: Mastermind
      skills: [society]
      key_ability_options: [int, dex]
      skill_choices:
        count: 1
        from: [arcana, nature, occultism, religion]
      notes: "Key ability Int or Dex. Free skill: one of Arcana/Nature/Occultism/Religion via cg/skill after commit."

  methodology:
    empiricism:
      name: Empiricism
      skills: []
      feats: [thats_odd]
      skill_choices:
        count: 1
        from_attribute: int
      notes: "Free skill: one Intelligence skill (arcana/crafting/occultism/society/lore) via cg/skill after commit."

    forensic_medicine:
      name: Forensic Medicine
      skills: [medicine]
      feats: [forensic_acumen, battle_medicine]
      notes: "Battle Medicine extras are resolution-side later."

    interrogation:
      name: Interrogation
      skills: [diplomacy]
      feats: [no_cause_for_alarm]
      notes: "Pointed Question when coded."

    alchemical_sciences:
      name: Alchemical Sciences
      skills: [crafting]
      feats: [alchemical_crafting]
      notes: "Formula book / starter formulas are inventory/staff side for now."

  order:
    animal:
      name: Animal
      skills: [athletics]
      feats: [animal_companion]
      focus_spells: [heal_animal]
      notes: "Anathema: wanton cruelty to animals (roleplay)."

    leaf:
      name: Leaf
      skills: [diplomacy]
      feats: [leshy_familiar]
      focus_spells: [cornucopia]
      notes: "Anathema: wanton cruelty to plants/fungi (roleplay)."

    storm:
      name: Storm
      skills: [acrobatics]
      feats: [storm_born]
      focus_spells: [tempest_surge]
      notes: "Anathema: major air pollution left unopposed (roleplay)."

    wild:
      name: Wild
      skills: [intimidation]
      feats: [wild_shape]
      focus_spells: [wild_morph]
      notes: "Remaster Untamed Order. Anathema: abandoning the wild (roleplay)."

    wave:
      name: Wave
      skills: [medicine]
      feats: [shore_step]
      focus_spells: [rising_surf]
      notes: "Anathema: polluting water (roleplay)."

    flame:
      name: Flame
      skills: [acrobatics]
      feats: [fire_lung]
      focus_spells: [wildfire]
      notes: "Anathema: suppressing needed wildfire / regrowth (roleplay)."

  muse:
    maestro:
      name: Maestro
      feats: [lingering_composition]
      repertoire_gifts:
        "1": soothe
      notes: "Composition specialist. Lingering Composition at 1st; soothe added to repertoire."

    enigma:
      name: Enigma
      feats: [bardic_lore]
      repertoire_gifts:
        "1": true_strike
      notes: "Bardic Lore at 1st; true_strike added to repertoire."

    polymath:
      name: Polymath
      feats: [versatile_performance]
      notes: "Versatile Performance at 1st. Additional Lore / flexible skill use is skill-side."

    warrior:
      name: Warrior
      skills: [athletics]
      feats: [martial_performance]
      proficiency:
        attacks:
          martial: T
      repertoire_gifts:
        "1": fear
      notes: "Martial weapons + Martial Performance; fear added to repertoire."

  contact:
    faiths_flamekeeper:
      name: Faith's Flamekeeper
      tradition: divine
      skills: [religion]
      focus_spells: [stoke_the_heart]
      notes: "Divine list. Initial lesson: Fervor's Grasp (stoke the heart). Familiar learns command (staff/familiar side)."

    the_inscribed_one:
      name: The Inscribed One
      tradition: arcane
      skills: [arcana]
      focus_spells: [discern_secrets]
      notes: "Arcane list. Initial lesson: Glyph's Supremacy (discern secrets)."

    silence_in_snow:
      name: Silence in Snow
      tradition: primal
      skills: [nature]
      focus_spells: [clinging_ice]
      notes: "Primal list. Initial lesson: Winter's Chill. Hex slug may be refined when spell catalog catches up."

    spinner_of_threads:
      name: Spinner of Threads
      tradition: occult
      skills: [occultism]
      focus_spells: [nudge_the_odds]
      notes: "Occult list. Fate / fortune-misfortune lesson. Hex slug may be refined when spell catalog catches up."

    wilding_steward:
      name: Wilding Steward
      tradition: primal
      skills: [nature]
      focus_spells: [wild_speech]
      notes: "Primal list. Initial lesson: Wild Speech. Familiar of the wild (familiar side)."

  cause:
    justice:
      name: Justice
      features: [cause_justice, retributive_strike]
      focus_spells: [lay_on_hands]
      notes: "Edicts: follow the law, respect legitimate authority. Anathema: cheat / take advantage. Reaction: Retributive Strike."

    liberation:
      name: Liberation
      features: [cause_liberation, liberating_step]
      focus_spells: [lay_on_hands]
      notes: "Edicts: oppose slavery and tyranny; fight for others' freedom. Anathema: force or threaten others' choices. Reaction: Liberating Step."

    redemption:
      name: Redemption
      features: [cause_redemption, glimpse_of_redemption]
      focus_spells: [lay_on_hands]
      notes: "Edicts: redeem the wicked, show compassion. Anathema: kill a creature that could be redeemed / refuse a sincere plea. Reaction: Glimpse of Redemption."

    obedience:
      name: Obedience
      features: [cause_obedience, iron_command]
      focus_spells: [lay_on_hands]
      notes: "Edicts: enforce proper hierarchies; lead when suited. Anathema: submit to one lesser than you. Reaction: Iron Command. Table tone may restrict this cause."

  school:
    abjuration:
      name: Abjuration
      features: [school_abjuration]
      notes: "Curriculum cantrip + two 1st-rank school spells into spellbook (staff/catalog pass). School focus when curriculum data exists."

    conjuration:
      name: Conjuration
      features: [school_conjuration]
      notes: "Curriculum cantrip + two 1st-rank school spells into spellbook (staff/catalog pass)."

    divination:
      name: Divination
      features: [school_divination]
      notes: "Curriculum cantrip + two 1st-rank school spells into spellbook (staff/catalog pass)."

    enchantment:
      name: Enchantment
      features: [school_enchantment]
      notes: "Curriculum cantrip + two 1st-rank school spells into spellbook (staff/catalog pass)."

    evocation:
      name: Evocation
      features: [school_evocation]
      notes: "Curriculum cantrip + two 1st-rank school spells into spellbook (staff/catalog pass)."

    illusion:
      name: Illusion
      features: [school_illusion]
      notes: "Curriculum cantrip + two 1st-rank school spells into spellbook (staff/catalog pass)."

    transmutation:
      name: Transmutation
      features: [school_transmutation]
      notes: "Curriculum cantrip + two 1st-rank school spells into spellbook (staff/catalog pass)."

    universalist:
      name: Universalist
      features: [school_universalist]
      notes: "No specialist curriculum. Extra 1st-level class feat when feat data/slots support it; Drain Bonded Item flexibility is combat/magic-side."

  edge:
    precision:
      name: Precision
      skills: []
      combat_tag: precision
      notes: "Combat resolution later; token only."
    flurry:
      name: Flurry
      skills: []
      combat_tag: flurry
      notes: "Combat resolution later; token only."
    outwit:
      name: Outwit
      skills: []
      combat_tag: outwit
      notes: "Combat resolution later; token only."
