# Class option grants (Remaster-oriented). Open lists gated in chargen_policy.rb.
# Lookup: Pf2e.read_data("subclasses", "bloodline") then [slug]
# apply via Pf2e.apply_subclass_grants!(sheet)

subclasses:
  # --- filled: bloodline + doctrine ---
  bloodline:
    imperial:
      name: Imperial
      tradition: arcane
      skills:
      - arcana
      - society
      cantrips:
      - detect_magic
      focus_spells:
      - ancestral_memories
      repertoire_gifts:
        "0": detect_magic
        "1": force_barrage
      notes: "Bloodline spells and gifts scale with level; initial focus is ancestral_memories."

    elemental:
      name: Elemental
      tradition: primal
      skills:
      - nature
      - intimidation
      cantrips:
      - ignition
      focus_spells:
      - elemental_toss
      repertoire_gifts:
        "0": ignition
        "1": breathe_fire
      notes: "Default elemental influence = fire for v1. Air/earth/metal/water/wood influence can be added later."

    fey:
      name: Fey
      tradition: primal
      skills:
      - deception
      - nature
      cantrips:
      - figment
      focus_spells:
      - faerie_dust
      repertoire_gifts:
        "0": figment
        "1": charm
      notes: "Bloodline focus: faerie_dust (initial)."

    angelic:
      name: Angelic
      tradition: divine
      skills:
      - diplomacy
      - religion
      cantrips:
      - light
      focus_spells:
      - angelic_halo
      repertoire_gifts:
        "0": light
        "1": heal
      notes: "Bloodline focus: angelic_halo (initial)."

  doctrine:
    cloistered:
      name: Cloistered Cleric
      steps:
        "1":
          features:
          - first_doctrine_cloistered
          feats:
          - domain_initiate
        "3":
          features:
          - second_doctrine_cloistered
          proficiency:
            fortitude: E
        "7":
          features:
          - third_doctrine_cloistered
          spellcasting:
            proficiency: E
        "11":
          features:
          - fourth_doctrine_cloistered
          proficiency:
            attacks:
              simple: E
              unarmed: E
        "15":
          features:
          - fifth_doctrine_cloistered
          spellcasting:
            proficiency: M
        "19":
          features:
          - final_doctrine_cloistered
          spellcasting:
            proficiency: L
      notes: "Domain Initiate at 1st. Spell proficiency advances on the cloistered track."

    warpriest:
      name: Warpriest
      steps:
        "1":
          features:
          - first_doctrine_warpriest
          feats:
          - shield_block
          proficiency:
            fortitude: E
            defenses:
              light: T
              medium: T
        "3":
          features:
          - second_doctrine_warpriest
          proficiency:
            attacks:
              martial: T
        "7":
          features:
          - third_doctrine_warpriest
          proficiency:
            attacks:
              simple: E
              unarmed: E
              martial: E
        "11":
          features:
          - fourth_doctrine_warpriest
          spellcasting:
            proficiency: E
        "15":
          features:
          - fifth_doctrine_warpriest
          proficiency:
            defenses:
              light: E
              medium: E
        "19":
          features:
          - final_doctrine_warpriest
          spellcasting:
            proficiency: M
      notes: "Armor + Fort expert + Shield Block at 1st. Martial weapons at 3rd. Spell proficiency lags cloistered."

  # --- filled: racket + methodology + order ---
  racket:
    ruffian:
      name: Ruffian
      skills:
      - intimidation
      proficiency:
        defenses:
          medium: T
      notes: "Medium armor; may use Strength as key ability. Sneak Attack with a wider weapon set is combat-side later."

    scoundrel:
      name: Scoundrel
      skills:
      - deception
      - diplomacy
      notes: "May use Charisma as key ability. Feint upgrades are combat-side later."

    thief:
      name: Thief
      skills:
      - thievery
      combat_tag: dex_damage_finesse
      notes: "Dexterity to damage with finesse melee is combat-side later."

    mastermind:
      name: Mastermind
      skills:
      - society
      notes: "Also trained in one of Arcana, Nature, Occultism, or Religion (player choice — train via skill pick). May use Intelligence as key ability. RK → off-guard is combat-side later."

  methodology:
    empiricism:
      name: Empiricism
      skills: []
      feats:
      - thats_odd
      notes: "Trained in one Intelligence-based skill of the player's choice (train via skill pick). That's Odd + Expeditious Inspection when those feats exist in data."

    forensic_medicine:
      name: Forensic Medicine
      skills:
      - medicine
      feats:
      - forensic_acumen
      - battle_medicine
      notes: "Battle Medicine level-bonus / 1-hour immunity is combat/medicine resolution later."

    interrogation:
      name: Interrogation
      skills:
      - diplomacy
      feats:
      - no_cause_for_alarm
      notes: "Pointed Question action when coded."

    alchemical_sciences:
      name: Alchemical Sciences
      skills:
      - crafting
      feats:
      - alchemical_crafting
      notes: "Formula book + two 1st-level elixir/tool formulas are inventory/staff side for now."

  order:
    animal:
      name: Animal
      skills:
      - athletics
      feats:
      - animal_companion
      focus_spells:
      - heal_animal
      notes: "Anathema: wanton cruelty to animals / unnecessary killing (roleplay)."

    leaf:
      name: Leaf
      skills:
      - diplomacy
      feats:
      - leshy_familiar
      focus_spells:
      - cornucopia
      notes: "Anathema: wanton cruelty to plants/fungi (roleplay)."

    storm:
      name: Storm
      skills:
      - acrobatics
      feats:
      - storm_born
      focus_spells:
      - tempest_surge
      notes: "Anathema: major air pollution left unopposed (roleplay)."

    wild:
      name: Wild
      skills:
      - intimidation
      feats:
      - wild_shape
      focus_spells:
      - wild_morph
      notes: "Remaster: Untamed Order. Anathema: becoming fully civilized / abandoning the wild (roleplay)."

    wave:
      name: Wave
      skills:
      - medicine
      feats:
      - shore_step
      focus_spells:
      - rising_surf
      notes: "Anathema: polluting water / letting major polluters go unpunished (roleplay)."

    flame:
      name: Flame
      skills:
      - acrobatics
      feats:
      - fire_lung
      focus_spells:
      - wildfire
      notes: "Anathema: suppressing natural wildfires that cleanse / allowing fire to be extinguished where regrowth needs it (roleplay; tone per table)."

