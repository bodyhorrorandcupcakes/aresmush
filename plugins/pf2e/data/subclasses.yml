# Class option grants (Remaster-oriented). Open lists gated in chargen_policy.rb.
# Lookup: Pf2e.read_data("subclasses", "bloodline") then [slug]
# apply via Pf2e.apply_subclass_grants!(sheet)

subclasses:
  # --- filled: bloodline + doctrine ---
  bloodline:
    imperial:
      name: Imperial
      tradition: arcane
      skills:
      - arcana
      - society
      cantrips:
      - detect_magic
      focus_spells:
      - ancestral_memories
      repertoire_gifts:
        "0": detect_magic
        "1": force_barrage
      notes: "Bloodline spells and gifts scale with level; initial focus is ancestral_memories."

    elemental:
      name: Elemental
      tradition: primal
      skills:
      - nature
      - intimidation
      cantrips:
      - ignition
      focus_spells:
      - elemental_toss
      repertoire_gifts:
        "0": ignition
        "1": breathe_fire
      notes: "Default elemental influence = fire for v1. Air/earth/metal/water/wood influence can be added later."

    fey:
      name: Fey
      tradition: primal
      skills:
      - deception
      - nature
      cantrips:
      - figment
      focus_spells:
      - faerie_dust
      repertoire_gifts:
        "0": figment
        "1": charm
      notes: "Bloodline focus: faerie_dust (initial)."

    angelic:
      name: Angelic
      tradition: divine
      skills:
      - diplomacy
      - religion
      cantrips:
      - light
      focus_spells:
      - angelic_halo
      repertoire_gifts:
        "0": light
        "1": heal
      notes: "Bloodline focus: angelic_halo (initial)."

  doctrine:
    cloistered:
      name: Cloistered Cleric
      steps:
        "1":
          features:
          - first_doctrine_cloistered
          feats:
          - domain_initiate
        "3":
          features:
          - second_doctrine_cloistered
          proficiency:
            fortitude: E
        "7":
          features:
          - third_doctrine_cloistered
          spellcasting:
            proficiency: E
        "11":
          features:
          - fourth_doctrine_cloistered
          proficiency:
            attacks:
              simple: E
              unarmed: E
        "15":
          features:
          - fifth_doctrine_cloistered
          spellcasting:
            proficiency: M
        "19":
          features:
          - final_doctrine_cloistered
          spellcasting:
            proficiency: L
      notes: "Domain Initiate at 1st. Spell proficiency advances on the cloistered track."

    warpriest:
      name: Warpriest
      steps:
        "1":
          features:
          - first_doctrine_warpriest
          feats:
          - shield_block
          proficiency:
            fortitude: E
            defenses:
              light: T
              medium: T
        "3":
          features:
          - second_doctrine_warpriest
          proficiency:
            attacks:
              martial: T
        "7":
          features:
          - third_doctrine_warpriest
          proficiency:
            attacks:
              simple: E
              unarmed: E
              martial: E
        "11":
          features:
          - fourth_doctrine_warpriest
          spellcasting:
            proficiency: E
        "15":
          features:
          - fifth_doctrine_warpriest
          proficiency:
            defenses:
              light: E
              medium: E
        "19":
          features:
          - final_doctrine_warpriest
          spellcasting:
            proficiency: M
      notes: "Armor + Fort expert + Shield Block at 1st. Martial weapons at 3rd. Spell proficiency lags cloistered."

