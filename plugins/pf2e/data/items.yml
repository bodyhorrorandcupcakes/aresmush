# General gear / consumables catalog (PF2e Remaster / Pathfinder Player Core).
# Lookup: Pf2e.read_data("items", "rope") or "rope_50" (alias)
# Source: Foundry VTT pf2e equipment pack (publication = Pathfinder Player Core).
# Plus synthetic belt_pouch / satchel (common containers not present as PC JSON).
#
# kind: gear | consumable
# bulk: L | 0 | 1 | 2 | … | "-" for worn-container negligible
# price: silver pieces (sp); fractional allowed for cp-priced goods (0.1 = 1 cp)
# quantity_per: for ammo/chalk packs — price is for this many units
# container:
#   capacity    — max Bulk the container can hold
#   ignore_bulk — first N Bulk of contents do not count toward carrier Bulk
#   worn_bulk   — bulk of the container itself when worn
# kit: list of {slug, qty} expanded at purchase if code supports it
#
